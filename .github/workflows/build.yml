  # ------------------------------------------------------------------
  # JOB 2: Download all artifacts and test on all OS versions
  # ------------------------------------------------------------------
  test-artifacts-linux:
    name: Test Artifacts (${{ matrix.os }})
    needs: [setup-environment, build-linux]
    
    strategy:
      matrix:
        os: ${{ fromJSON(needs.setup-environment.outputs.LINUX_VERSIONS) }}
        os: ${{ fromJSON(needs.setup-environment.outputs.LINUX_VERSIONS) }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          # Downloads all artifacts from the workflow into a directory named 'artifacts/'
          path: artifacts/
          # Pattern matching allows pulling all artifacts generated by the build matrix
          pattern: app-build-linux*
          merge-multiple: false

      - name: Verify downloaded artifacts
        run: |
          echo "=== Inspecting downloaded artifacts ==="
          ls -R artifacts/

      - name: Run tests on artifacts
        run: |
          echo "Running tests on target OS: ${{ matrix.os }}"

          os_versions=(${{ join(fromJSON(needs.setup-environment.outputs.LINUX_VERSIONS), ' ') }})
          py_versions=(${{ join(fromJSON(needs.setup-environment.outputs.PYTHON_VERSIONS), ' ') }})

          # Verify that expected artifact files exist
          for os_ver in "${os_versions[@]}"; do
            for py_ver in "${py_versions[@]}"; do

              # Install NCPA artifact
              sudo apt install -y ./artifacts/app-build-linux-${os_ver}-py${py_ver}/*.deb
              sleep 10
              sudo systemctl is-active ncpa

              # E2E Tests
              curl -k 'https://127.0.0.1:5693/api/system/agent_version?token=mytoken'
              sudo cp ./test/e2e/plugins/check_os.sh /usr/local/ncpa/plugins/
              bash ./test/e2e/test_ncpa_e2e.sh

              # Remove NCPA for next iteration
              sudo apt purge -y ncpa
              sudo rm -rf /usr/local/ncpa
              sleep 5

            done
          done

