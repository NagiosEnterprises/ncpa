  build-mac:
    name: Build (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      matrix:
        os: [macos-15-intel, macos-26-intel]
        python-version: ['3.11', '3.12']
      # Keep running other matrix jobs even if one fails
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build project
        working-directory: build
        run: sudo ./build.sh

      # The GH macOS runner default hostnames are too long and cause issues generating SSL certificates
      # Specifically this causes issues with the unit tests related to SSL certificate generation
      - name: Change macOS Hostname
        run: |
          NEW_HOSTNAME="gh-macos-runner"
          
          sudo scutil --set HostName "${NEW_HOSTNAME}.local"
          sudo scutil --set LocalHostName "${NEW_HOSTNAME}"
          sudo scutil --set ComputerName "${NEW_HOSTNAME}"
          
          # Optional: Flush DNS cache to apply changes immediately
          dscacheutil -flushcache

      - name: Run Unit Tests
        run: |
          sudo chown -R $USER build/
          source build/venvs/ncpa-build-darwin/bin/activate
          python -m pip install pytest
          pytest -v
          deactivate

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          # Use dynamic, unique names for each matrix combination artifact
          name: app-build-mac-${{ matrix.os }}-py${{ matrix.python-version }}
          path: build/*.dmg
          retention-days: 1

