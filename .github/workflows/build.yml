  test-artifacts-mac:
    name: Test Artifacts (${{ matrix.os }})
    needs: build-mac
    
    strategy:
      matrix:
        os: [macos-15-intel, macos-26-intel]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          # Downloads all artifacts from the workflow into a directory named 'artifacts/'
          path: artifacts/
          # Pattern matching allows pulling all artifacts generated by the build matrix
          pattern: app-build-mac*
          merge-multiple: false

      - name: Verify downloaded artifacts
        run: |
          echo "=== Inspecting downloaded artifacts ==="
          ls -R artifacts/

      # The GH macOS runner default hostnames are too long and cause issues generating SSL certificates
      - name: Change macOS Hostname
        run: |
          NEW_HOSTNAME="gh-macos-runner"
          
          sudo scutil --set HostName "${NEW_HOSTNAME}.local"
          sudo scutil --set LocalHostName "${NEW_HOSTNAME}"
          sudo scutil --set ComputerName "${NEW_HOSTNAME}"
          
          # Optional: Flush DNS cache to apply changes immediately
          dscacheutil -flushcache

      - name: Run tests on artifacts
        run: |
          echo "Running tests on target OS: ${{ matrix.os }}"

          os_versions=("macos-15-intel" "macos-26-intel")
          py_versions=("3.11" "3.12")

          # Verify that expected artifact files exist
          for os_ver in "${os_versions[@]}"; do
            for py_ver in "${py_versions[@]}"; do

              # Install NCPA artifact
              sudo hdiutil attach -nobrowse ./artifacts/app-build-mac-${os_ver}-py${py_ver}/*.dmg
              sudo zsh /Volumes/NCPA*/install.sh
              sleep 10
              sudo launchctl list | grep ncpa

              # E2E Tests
              curl -k 'https://127.0.0.1:5693/api/system/agent_version?token=mytoken'
              sudo cp ./test/e2e/plugins/check_os.sh /usr/local/ncpa/plugins/
              bash ./test/e2e/test_ncpa_e2e.sh

              # Remove NCPA for next iteration
              sudo hdiutil detach /Volumes/NCPA*
              sudo /usr/local/ncpa/uninstall.sh
              sudo rm -rf /usr/local/ncpa
              sleep 5

            done
          done