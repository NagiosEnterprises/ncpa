name: Multi-OS Python Matrix

on:
  push:
    branches: [ 'cpd-test-actions-build-windows' ]

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Build artifacts across matrix combinations
  # ------------------------------------------------------------------
  build-linux:
    name: Build (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ['3.11', '3.12']
      # Keep running other matrix jobs even if one fails
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create build output
        run: |
          mkdir -p dist-linux
          echo "Built on ${{ matrix.os }} with Python ${{ matrix.python-version }}" > dist-linux/build-info.txt
          # Add your actual build commands here (e.g., python -m build)

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          # Use dynamic, unique names for each matrix combination artifact
          name: app-build-linux-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist-linux/
          retention-days: 1

  build-windows:
    name: Build (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      matrix:
        os: [windows-2022, windows-2022]
        python-version: ['3.11', '3.12']
      # Keep running other matrix jobs even if one fails
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create build output
        run: |
          mkdir dist-windows
          Write-Host "Built on ${{ matrix.os }} with Python ${{ matrix.python-version }}" > dist-windows/build-info.txt
          # Add your actual build commands here (e.g., python -m build)

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          # Use dynamic, unique names for each matrix combination artifact
          name: app-build-windows-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist-windows/
          retention-days: 1

  # ------------------------------------------------------------------
  # JOB 2: Download all artifacts and test on both Ubuntu versions
  # ------------------------------------------------------------------
  test-all-artifacts-linux:
    name: Test All Artifacts (${{ matrix.os }})
    needs: build-linux # Ensures this job only runs after 'build-linux' completes successfully
    
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          # Downloads all artifacts from the workflow into a directory named 'artifacts/'
          path: artifacts/
          # Pattern matching allows pulling all artifacts generated by the build matrix
          pattern: app-build-linux*
          merge-multiple: false

      - name: Verify downloaded artifacts
        run: |
          echo "=== Inspecting downloaded artifacts ==="
          ls -R artifacts/

      - name: Run tests on artifacts
        run: |
          echo "Running tests on target OS: ${{ matrix.os }}"
          
          # Example test: Verify that all 4 expected artifact subdirectories exist
          for os_ver in ubuntu-22.04 ubuntu-24.04; do
            for py_ver in 3.11 3.12; do
              artifact_dir="artifacts/app-build-linux-${os_ver}-py${py_ver}"
              if [ -f "$artifact_dir/build-info.txt" ]; then
                echo "SUCCESS: Found build output for $os_ver Python $py_ver"
                cat "$artifact_dir/build-info.txt"
              else
                echo "ERROR: Missing artifact for $os_ver Python $py_ver"
                exit 1
              fi
            done
          done

  test-all-artifacts-windows:
    name: Test All Artifacts (${{ matrix.os }})
    needs: build-windows
    
    strategy:
      matrix:
        os: [windows-2022, windows-2022]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          # Downloads all artifacts from the workflow into a directory named 'artifacts/'
          path: artifacts/
          # Pattern matching allows pulling all artifacts generated by the build matrix
          pattern: app-build-windows*
          merge-multiple: false

      - name: Verify downloaded artifacts
        run: |
          Write-Host "=== Inspecting downloaded artifacts ==="
          dir artifacts/

      - name: Run tests on artifacts
        run: |
          $osVersions = @("windows-2019", "windows-2022")
          $pyVersions = @("3.11", "3.12")

          foreach ($osVer in $osVersions) {
              foreach ($pyVer in $pyVersions) {
                  $artifactDir = "artifacts/app-build-windows-${osVer}-py${pyVer}"
                  $filePath = "$artifactDir/build-info.txt"

                  if (Test-Path -Path $filePath -PathType Leaf) {
                      Write-Host "SUCCESS: Found build output for $osVer Python $pyVer"
                      Get-Content -Path $filePath
                  } else {
                      Write-Error "ERROR: Missing artifact for $osVer Python $pyVer"
                      exit 1
                  }
              }
          }