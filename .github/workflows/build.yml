name: Multi-OS Python Matrix

on:
  push:
    branches: [ 'cpd-test-actions-build-windows' ]

jobs:
  # ------------------------------------------------------------------
  # SETUP JOB: Define and export the array variables
  # ------------------------------------------------------------------
  setup-environment:
    runs-on: ubuntu-latest
    outputs:
      LINUX_VERSIONS: ${{ steps.set-vars.outputs.LINUX_VERSIONS }}
      WINDOWS_VERSIONS: ${{ steps.set-vars.outputs.WINDOWS_VERSIONS }}
      MACOS_VERSIONS: ${{ steps.set-vars.outputs.MACOS_VERSIONS }}
      PYTHON_VERSIONS: ${{ steps.set-vars.outputs.PYTHON_VERSIONS }}
    steps:
      - id: set-vars
        run: |
          echo 'LINUX_VERSIONS=["ubuntu-22.04", "ubuntu-24.04"]' >> $GITHUB_OUTPUT
          echo 'WINDOWS_VERSIONS=["windows-2022", "windows-2025"]' >> $GITHUB_OUTPUT
          echo 'MACOS_VERSIONS=["macos-15-intel", "macos-26-intel"]' >> $GITHUB_OUTPUT
          echo 'PYTHON_VERSIONS=["3.11", "3.12"]' >> $GITHUB_OUTPUT

  # ------------------------------------------------------------------
  # BUILD JOBS: Build artifacts across matrix combinations
  # ------------------------------------------------------------------
  build-linux:
    name: Build (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: setup-environment
    strategy:
      matrix:
        os: ${{ fromJSON(needs.setup-environment.outputs.LINUX_VERSIONS) }}
        python-version: ${{ fromJSON(needs.setup-environment.outputs.PYTHON_VERSIONS) }}
      # Keep running other matrix jobs even if one fails
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build project
        working-directory: build
        run: sudo ./build.sh

      - name: Run Unit Tests
        run: |
          sudo chown -R $USER:$USER build/
          source build/venvs/ncpa-build-linux/bin/activate
          python -m pip install pytest
          pytest -v
          deactivate

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          # Use dynamic, unique names for each matrix combination artifact
          name: app-build-linux-${{ matrix.os }}-py${{ matrix.python-version }}
          path: build/*.deb
          retention-days: 1

