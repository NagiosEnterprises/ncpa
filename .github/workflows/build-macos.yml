name: Build macOS

on:
  push:
    branches: [ 'cpd-test-actions-build-windows-disabled' ]

jobs:
  build-macos:
    runs-on: macos-15-intel
    
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.13'

      - name: Build project
        working-directory: build
        run: |
          sudo ./build.sh

      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: ncpa-macOS
          path: build/*.dmg
          overwrite: true