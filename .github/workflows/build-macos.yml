name: Build macOS

on:
  push:
    branches: [ 'cpd-test-actions-build-windows' ]

jobs:
  build-macos:
    runs-on: macos-15-intel
    
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.13'

      - name: Build project
        working-directory: build
        run: |
          sudo ./build.sh

      - name: Run unit tests
        run: |
          sudo chown -R $USER build/
          source build/venvs/ncpa-build-darwin/bin/activate
          python -m pip install pytest
          pytest -v
          deactivate

      - name: Test macOS Install
        working-directory: build
        run: |
          sudo hdiutil attach -nobrowse ncpa*.dmg
          sudo zsh /Volumes/NCPA*/install.sh

      - name: Sleep for 10 seconds
        run: sleep 10

      - name: Ensure service is running
        run: |
          sudo launchctl list | grep ncpa

      - name: Test API
        run: |
          curl -k 'https://127.0.0.1:5693/api/system/agent_version?token=mytoken'

      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: ncpa-macOS
          path: build/*.dmg
          overwrite: true