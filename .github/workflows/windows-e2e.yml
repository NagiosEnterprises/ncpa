name: Windows e2e Test

on:
  push:
    branches: [ 'cpd-enable-github-actions' ]

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.13'

        # Install MSVC
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

        # Install NSIS Compiler
      - name: Install NSIS Compiler
        uses: negrutiu/nsis-install@v3

      - name: Verify Runner Prerequisites
        shell: pwsh
        run: |
          Write-Host "Python:" (Get-Command python -ErrorAction SilentlyContinue).Source
          Write-Host "cl.exe:" (Get-Command cl -ErrorAction SilentlyContinue).Source
          Write-Host "makensis:" (Get-Command makensis -ErrorAction SilentlyContinue).Source
          Write-Host "Git:" (Get-Command git -ErrorAction SilentlyContinue).Source

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r build/resources/require.win.txt

      - name: Build NCPA Windows Installer
        run: python build/windows/build_ncpa.py python

      - name: Run Unit Tests
        run: |
          python -m pip install pytest
          pytest -v

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v7
        with:
          name: ncpa-windows
          path: build/ncpa-*.exe
          overwrite: true

  # Job 2: Wait for Job 1, download the artifact, and use it
  e2e-windows:
    runs-on: windows-2025
    needs: build-windows # Crucial: Enforces sequential execution
    steps:
      - uses: actions/checkout@v7

      - name: Download Build Artifact
        uses: actions/download-artifact@v7
        with:
          name: ncpa-windows
          path: downloaded-assets/

      - name: Verify Artifact File
        run: Test-Path -Path ".\downloaded-assets\ncpa*.exe"

      - name: Test Windows Install
        run: Start-Process -FilePath ".\downloaded-assets\ncpa*.exe" -ArgumentList "/S", "/TOKEN='8675309'" -Wait

      - name: Sleep for 10 seconds
        run: Start-Sleep -s 10
        shell: powershell

      - name: Ensure Service is Running
        run: Get-Service NCPA

      - name: Test API Sanity Check
        run: curl.exe -k 'https://127.0.0.1:5693/api/system/agent_version?token=8675309'

      - name: Copy Custom Plugin
        run: Copy-Item -Path "test\e2e\plugins\check_os.ps1" -Destination "C:\Program Files\Nagios\NCPA\plugins\"

      - name: Run E2E Tests
        run: .\test\e2e\test_ncpa_e2e.ps1

