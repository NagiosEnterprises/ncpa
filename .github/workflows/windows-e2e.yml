name: Windows e2e Test

on:
  push:
    branches: [ 'cpd-test-actions-build-windows-disabled' ]

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.13'

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify runner prerequisites
        shell: pwsh
        run: |
          Write-Host "Python:" (Get-Command python -ErrorAction SilentlyContinue).Source
          Write-Host "cl.exe:" (Get-Command cl -ErrorAction SilentlyContinue).Source
          Write-Host "makensis:" (Get-Command makensis -ErrorAction SilentlyContinue).Source
          Write-Host "Git:" (Get-Command git -ErrorAction SilentlyContinue).Source

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r build/resources/require.win.txt

      - name: Build NCPA installer
        run: python build/windows/build_ncpa.py "${{ steps.setup-python.outputs.python-path }}"

      - name: Run unit tests
        run: |
          python -m pip install pytest
          pytest -v

      - name: Test Windows Install
        working-directory: build
        run: |
          Start-Process -FilePath ".\ncpa*.exe" -ArgumentList "/S", "/TOKEN='8675309'" -Wait

      - name: Sleep for 10 seconds
        run: Start-Sleep -s 10
        shell: powershell

      - name: Ensure service is running
        run: |
          Get-Service NCPA

      - name: Test API
        run: |
          curl.exe -k 'https://127.0.0.1:5693/api/system/agent_version?token=8675309'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: ncpa-windows
          path: build/ncpa-*.exe
          overwrite: true
